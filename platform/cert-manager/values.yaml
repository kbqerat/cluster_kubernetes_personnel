# jetstack/cert-manager chart values
crds:
  enabled: true
  keep: true

replicaCount: 1
resources:
  requests: { cpu: 10m, memory: 48Mi }
  limits: { memory: 128Mi }

webhook:
  replicaCount: 1
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }

cainjector:
  replicaCount: 1
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 128Mi }

prometheus:
  enabled: true
  servicemonitor:
    enabled: true

# Speeds up DNS-01 self-checks once a real Cloudflare domain is wired up.
dns01RecursiveNameservers: "1.1.1.1:53,8.8.8.8:53"
dns01RecursiveNameserversOnly: true
