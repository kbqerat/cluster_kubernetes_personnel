# Primary issuer for the whole cluster while running free/offline.
# Issues leaf certs (wildcard *.192-168-252-240.sslip.io, client certs, etc.)
# signed by the homelab root CA.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: homelab-ca
spec:
  ca:
    secretName: homelab-root-ca
