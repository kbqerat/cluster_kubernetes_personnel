# NOT synced by ArgoCD (argocd/apps/03 excludes *.example.yaml).
# When you get a Cloudflare domain:
#   1. Cloudflare dashboard -> My Profile -> API Tokens -> Create Token
#      Permissions: Zone / DNS / Edit  +  Zone / Zone / Read   (scoped to your zone)
#   2. Encrypt it with SOPS and commit as a real manifest, OR apply it out-of-band:
#      kubectl -n cert-manager create secret generic cloudflare-api-token \
#        --from-literal=api-token='<TOKEN>'
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
type: Opaque
stringData:
  api-token: "REPLACE_WITH_CLOUDFLARE_API_TOKEN"
