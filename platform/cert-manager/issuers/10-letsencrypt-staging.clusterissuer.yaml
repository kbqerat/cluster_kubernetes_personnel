# DORMANT until you own a domain on Cloudflare.
# Needs secret cert-manager/cloudflare-api-token (see cloudflare-api-token.secret.example.yaml).
# Then: switch a Certificate's issuerRef to "letsencrypt-staging", verify, then "letsencrypt-prod".
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: bekkaoui.tarek2001@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - "example.com"   # <-- replace with your real Cloudflare zone
