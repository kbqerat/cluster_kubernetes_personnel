# NOT synced (argocd/apps/11 excludes *.example.yaml). Real secret is created
# out-of-band or via SOPS. The 'users' key is an htpasswd (bcrypt) line:
#   htpasswd -nbBC 10 admin 'changeme'
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-auth
  namespace: traefik
type: Opaque
stringData:
  users: "admin:$2y$10$REPLACE_WITH_BCRYPT_HASH"
