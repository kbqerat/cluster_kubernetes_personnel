# grafana/loki chart — single-binary, filesystem storage, no object store,
# no memcached. Smallest footprint that still ingests + queries logs.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 72h
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
    volume_enabled: true
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: false
  rulerConfig:
    storage:
      type: local
      local:
        directory: /var/loki/rules

singleBinary:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 512Mi }
  persistence:
    enabled: true
    size: 5Gi

# Everything below is off for a homelab.
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
gateway:
  enabled: false
minio:
  enabled: false

# Zero out the microservice targets (ignored in SingleBinary mode, set for clarity).
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }

monitoring:
  selfMonitoring:
    enabled: false
  serviceMonitor:
    enabled: true
