# Public route — TLS via the default wildcard cert, no client cert required.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami
  namespace: demo
spec:
  entryPoints: ["websecure"]
  routes:
    - match: Host(`whoami.192-168-252-240.sslip.io`)
      kind: Rule
      services:
        - name: whoami
          port: 80
  tls: {}
